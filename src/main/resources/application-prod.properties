spring.datasource.url=jdbc:mysql://<HOST>:3306/alquiler_eventos?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=<usuario_prod>
spring.datasource.password=<password_segura>

# no toca tablas
spring.jpa.hibernate.ddl-auto=validate

# No ejecutar data.sql en prod
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

logging.level.com.alquilerventos=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
